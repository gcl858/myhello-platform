# =============================================================
#  SonataFlow 工作流程定義檔 (Serverless Workflow 規格 0.8 版)
# =============================================================
#  本檔案使用 CNCF Serverless Workflow 規格 0.8 來定義一個
#  簡單的工作流程,目的是示範 SonataFlow (前身為 Kogito) 中
#  最基本、最核心的幾個概念,包括:
#    1. 工作流程的基本中繼資料 (id / version / name / description)
#    2. 輸入資料的 JSON Schema 驗證 (dataInputSchema)
#    3. 透過 OpenAPI 規格呼叫外部 REST API (functions / type: rest)
#    4. operation 類型的 state (用來執行動作 actions)
#    5. actionDataFilter 與 stateDataFilter 對資料進行轉換
#    6. 使用 jq 風格的運算式 ($.xxx) 來擷取與重組 JSON
#    7. 工作流程的終止 (end: true)
#
#  整體執行流程概述:
#  -------------------------------------------------
#  Client 啟動工作流程
#        │
#        ▼
#  SonataFlow 引擎驗證輸入 (依 dataInputSchema 的 JSON Schema)
#        │
#        ▼
#  進入 FetchDataState (type: operation)
#        │
#        ▼
#  執行 callApiAction 動作──呼叫 fetchApiData 函式
#  (此函式透過 OpenAPI 規格呼叫 /q/health 端點)
#        │
#        ▼
#  actionDataFilter 將 API 回應放到 .apiResponse
#        │
#        ▼
#  stateDataFilter 過濾最終輸出
#  (組合 greeting + data 兩個欄位)
#        │
#        ▼
#  end: true → 工作流程結束,回傳產出資料
#  -------------------------------------------------
#  package: sonataflow-addons-quarkus-openapi
# =============================================================

# -----------------------------------------------------------------
# id: 工作流程的唯一識別碼
#     - 在同一個 SonataFlow 應用程式中必須唯一
#     - SonataFlow 也會將這個 id 用於 Cloud Event / 公佈等情境
# -----------------------------------------------------------------
id: OpenAPI-workflow

# -----------------------------------------------------------------
# version: 工作流程的版本字串
#     - 任何字串皆可,建議遵循語意化版本 (Semantic Versioning)
#     - 當您升級流程時,應同步修改此版本,避免客戶端呼叫到舊版
# -----------------------------------------------------------------
version: '1.0.0'

# -----------------------------------------------------------------
# specVersion: 對應的 CNCF Serverless Workflow 規格版本
#     - 本檔案採用 0.8 版
#     - 必須與 SonataFlow 目前支援的版本匹配,否則引擎會拒絕載入
# -----------------------------------------------------------------
specVersion: '0.8'

# -----------------------------------------------------------------
# name: 給人閱讀的工作流程名稱
#     - 通常會顯示在 SonataFlow 管理介面、追蹤記錄中
# -----------------------------------------------------------------
name: My First Workflow

# -----------------------------------------------------------------
# description: 工作流程的詳細說明
#     - 用於文件、管理介面或監控儀表板
#     - 建議使用完整句子,說明工作流程目的與使用情境
# -----------------------------------------------------------------
description: A simple workflow that demonstrates basic concepts

# -----------------------------------------------------------------
# start: 進入工作流程後第一個要被執行的 state 名稱
#     - 工作流程一定由此開始
#     - 對應下方 states 清單中的 FetchDataState
# -----------------------------------------------------------------
start: FetchDataState

# -----------------------------------------------------------------
# 僅保留 dataInputSchema，移除 dataOutputSchema
# 說明:
#   - dataInputSchema: 用來驗證「啟動工作流程時傳入的初始資料」
#   - 參考的是 classpath 中的 JSON Schema 檔案 (input-schema.json)
#   - 此 Schema 要求呼叫端必須提供一個字串欄位 `name`,
#     否則啟動會失敗
#   - 注意: 我們刻意只保留 input schema,沒有 output schema
#     這是因為本範例的最終輸出結構是由 stateDataFilter 動態決定,
#     且不同流程可能會輸出不同形狀的資料,無須事先強制約束
# -----------------------------------------------------------------
dataInputSchema: classpath:schemas/input-schema.json

# =============================================================
# functions: 自訂函式清單
#   - 這裡宣告的是「工作流程可呼叫的函式」
#   - 其中 type: rest 代表這個函式底層打的是 REST API
#   - operation 欄位使用 OpenAPI 規格片段定位具體端點
#     格式: <OpenAPI 檔案>#<operationId>
# =============================================================
functions:
  # ---------------------------------------------------------------
  # fetchApiData: 透過 OpenAPI 呼叫 /q/health 取得健康狀態資料
  # ---------------------------------------------------------------
  #   - name: 函式名稱,稍後在 actions[*].functionRef.refName 引用
  #   - operation: 指向 classpath:specs/openapi.yaml 內
  #                operationId 為 getData 的端點
  #   - type: rest 表示 SonataFlow 會以 HTTP 方式呼叫此端點
  #
  #   為什麼使用 OpenAPI?
  #     - OpenAPI 是業界標準,可重複使用前後端團隊共用的契約
  #     - SonataFlow 會自動依 OpenAPI 規格生成對應的 Java 客戶端
  #     - 請求/回應 schema 會自動轉換為強型別的 Java 物件
  # ---------------------------------------------------------------
  - name: fetchApiData
    operation: classpath:specs/openapi.yaml#getData
    type: rest

# =============================================================
# states: 工作流程所有狀態的集合
#   - 一個工作流程由多個 state 組成
#   - 每個 state 都有自己的 type
#     (operation / switch / event / foreach / inject / parallel ...)
#   - state 之間可透過 transition 串接,本範例只有一個 state
# =============================================================
states:
  # -------------------------------------------------------------
  # FetchDataState: 第一個也是唯一的狀態
  # type: operation 表示這個 state 會「執行某些動作」
  # -------------------------------------------------------------
  # 工作流程進入此 state 後,會依序執行:
  #   1. actions 內所有動作 (這裡只有 callApiAction)
  #   2. 套用 stateDataFilter 將 state 內部資料轉成最終輸出
  #   3. 依 end 旗標決定是否結束工作流程
  # -------------------------------------------------------------
  - name: FetchDataState
    type: operation

    # -----------------------------------------------------------
    # actions: 此 state 要執行的一連串動作
    #   - 動作會依序列出順序執行
    #   - 每個動作可對應到 functions 中宣告的函式
    # -----------------------------------------------------------
    actions:
      # ---------------------------------------------------------
      # callApiAction: 呼叫 fetchApiData 函式
      # ---------------------------------------------------------
      # functionRef:
      #   refName: 對應到 functions[*].name = fetchApiData
      #   (其他欄位如 arguments / selectionSet /
      #    retry / timeout 等可省略,本範例使用預設值)
      #
      # actionDataFilter: 對「動作結果」做資料過濾
      #   - results: "." 表示完整保留函式回傳的結果
      #     (jq 風格,"." 代表原始 payload)
      #   - toStateData: "${ .apiResponse }"
      #     將動作結果包進 .apiResponse 這個欄位
      #     最終存放到 state 內部資料 (state.data.apiResponse)
      # ---------------------------------------------------------
      - name: callApiAction
        functionRef:
          refName: fetchApiData
        actionDataFilter:
          results: "."
          toStateData: "${ .apiResponse }"

    # -----------------------------------------------------------
    # stateDataFilter: 對「整個 state 的最終輸出」做過濾
    #   - output: 用 jq 風格的字串模板生成最終 JSON
    #     '{ greeting: "Hello, \(.name)!", data: .apiResponse }'
    #       - greeting: 從 input 取 .name 組合成招呼語
    #         (注意: \(.name) 是字串插值,等同於模板字串)
    #       - data: 來自前面 actionDataFilter 放的 .apiResponse
    # -----------------------------------------------------------
    stateDataFilter:
      output: '{ greeting: "Hello, \(.name)!", data: .apiResponse }'

    # -----------------------------------------------------------
    # end: true 代表這個 state 結束後工作流程即結束
    #   - false 則會等待 transition 指向下一個 state
    #   - 本範例只有一個 state,因此直接結束
    # -----------------------------------------------------------
    end: true