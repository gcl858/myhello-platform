# =====================================================================
# distribution/transfer-app / application.properties
# ---------------------------------------------------------------------
# Transfer 業務之 Quarkus 應用設定 — 會疊加 platform-data-index 內的 base。
# 任何在此用相同 key 設定的條目都會覆寫 base。
# =====================================================================

# ---------- HTTP ----------
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# ---------- Logging ----------
quarkus.log.file.enabled=true
quarkus.log.file.path=logs/transfer-app.log
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=10

# ---------- OpenAPI Filter (新 package 路徑) ----------
mp.openapi.filter=com.example.platform.security.SonataFlowSecurityConfig$SwaggerFilter

# ---------- CORS 關閉 ----------
quarkus.http.cors.enabled=false

# ---------- Kogito / SonataFlow Function 設定 ----------
# callAaaService (展示用 https endpoint,apimgw-uat.tcbbank.com.tw)
kogito.sw.functions.callAaaService.scheme=https
kogito.sw.functions.callAaaService.host=apimgw-uat.tcbbank.com.tw
kogito.sw.functions.callAaaService.port=443

# fetchHealthData (rest-workflow 範例用)
kogito.sw.functions.fetchHealthData.protocol=http
kogito.sw.functions.fetchHealthData.host=localhost
kogito.sw.functions.fetchHealthData.port=8080

# callApiViaOpenAPI (saga2-transfer-workflow 主路徑)
kogito.sw.functions.callApiViaOpenAPI.protocol=http
kogito.sw.functions.callApiViaOpenAPI.host=localhost
kogito.sw.functions.callApiViaOpenAPI.port=8080

# ---------- TLS / Proxy ----------
quarkus.tls.trust-all=true
system.property.http.nonProxyHosts=localhost|127.0.0.1|*.tcbbank.com.tw
system.property.https.nonProxyHosts=localhost|127.0.0.1|*.tcbbank.com.tw

# ---------- Test profile ----------
# 對應 %test.* — 將測試 port 改回 8080,讓 self-call 可命中
%test.quarkus.http.test-port=8080
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:target/test-reconciliation.db
%test.quarkus.oidc.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc.auth-server-url=none
%test.quarkus.keycloak.devservices.enabled=false

# ---------- Index Dependencies ----------
quarkus.index-dependency.platform-common.group-id=org.acme.platform
quarkus.index-dependency.platform-common.artifact-id=platform-common
quarkus.index-dependency.platform-security.group-id=org.acme.platform
quarkus.index-dependency.platform-security.artifact-id=platform-security
quarkus.index-dependency.platform-data-index.group-id=org.acme.platform
quarkus.index-dependency.platform-data-index.artifact-id=platform-data-index
quarkus.index-dependency.transfer-api.group-id=org.acme.platform
quarkus.index-dependency.transfer-api.artifact-id=transfer-api
quarkus.index-dependency.transfer-workflow.group-id=org.acme.platform
quarkus.index-dependency.transfer-workflow.artifact-id=transfer-workflow
quarkus.index-dependency.transfer-samples.group-id=org.acme.platform
quarkus.index-dependency.transfer-samples.artifact-id=transfer-samples
quarkus.index-dependency.reconciliation-api.group-id=org.acme.platform
quarkus.index-dependency.reconciliation-api.artifact-id=reconciliation-api

