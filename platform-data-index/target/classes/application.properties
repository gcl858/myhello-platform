# =====================================================================
# platform-data-index / application.properties
# ---------------------------------------------------------------------
# Kogito Data Index + SQLite + Hibernate 之「基礎」設定。
# 任何 distribution 模組組裝了 platform-data-index 後,都會自動繼承
# 此檔之設定;distribution 模組可在自己 application.properties 內
# 用同一個 key 覆寫。
#
# 注意事項:
# 1. db-kind 保持 other — Quarkus 3.27.x 沒有 db-kind=sqlite 內建
# 2. jdbc.driver 必須明確指定 — 修補的 Kogito SQLite addon 期待這個 driver
# 3. journal_mode=WAL + foreign_keys=ON — 與本專案 SQLite 設定一致
# 4. OIDC 全關 — 本平台不接 Keycloak
# =====================================================================

# ---------- Datasource ----------
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
# distribution 模組可覆寫 (例如 production 改用外部路徑)
quarkus.datasource.jdbc.url=jdbc:sqlite:data/reconciliation.db
quarkus.datasource.jdbc.max-size=1
quarkus.datasource.jdbc.additional-jdbc-properties.foreign_keys=true
quarkus.datasource.jdbc.additional-jdbc-properties.journal_mode=WAL
quarkus.datasource.jdbc.additional-jdbc-properties.synchronous=NORMAL

# ---------- Hibernate ORM ----------
quarkus.hibernate-orm.dialect=org.acme.platform.dataindex.KogitoSQLiteDialect
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ---------- Flyway ----------
kie.flyway.enabled=true

# ---------- OIDC / Keycloak 全關 ----------
quarkus.oidc.enabled=false
quarkus.oidc.tenant-enabled=false
quarkus.oidc.auth-server-url=none
quarkus.keycloak.devservices.enabled=false

# ---------- Data Index GraphQL UI 始終啟用 ----------
quarkus.kogito.data-index.graphql.ui.always-include=true

# ---------- Kogito Blocking GraphQL 路由 ----------
kogito.data-index.blocking=true

# ---------- SonataFlow Dev UI 設定 ----------
sonataflow.devui.isLocalCluster=false
kogito.data-index.url=http://localhost:${quarkus.http.port:8080}

# ---------- Data Index management endpoint 關閉 (本平台用一般 health 即可) ----------
quarkus.smallrye-health.management.enabled=false
